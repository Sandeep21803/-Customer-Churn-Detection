<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Churn - Demo UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="mb-3">Customer Churn Demo (Flask)</h1>

      <div class="row">
        <div class="col-md-6">
          <h5>Model metrics</h5>
          <ul>
            <li>Accuracy: {{ metrics['accuracy'] }}</li>
            <li>Recall: {{ metrics['recall'] }}</li>
            <li>F1: {{ metrics['f1'] }}</li>
            <li>ROC AUC: {{ metrics['roc_auc'] }}</li>
          </ul>
          <h5>Sample data</h5>
          <div>{{ sample_table | safe }}</div>
        </div>

        <div class="col-md-6">
          <h5>Make a single prediction</h5>
          <form method="post" action="/predict">
            <div class="mb-2">
              <label class="form-label">Credit Score</label>
              <input class="form-control" name="CreditScore" value="650">
            </div>
            <div class="mb-2">
              <label class="form-label">Geography</label>
              <select class="form-select" name="Geography">
                <option>France</option>
                <option>Spain</option>
                <option>Germany</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Gender</label>
              <select class="form-select" name="Gender">
                <option>Male</option>
                <option>Female</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Age</label>
              <input class="form-control" name="Age" value="40">
            </div>
            <div class="mb-2">
              <label class="form-label">Tenure</label>
              <input class="form-control" name="Tenure" value="3">
            </div>
            <div class="mb-2">
              <label class="form-label">Balance</label>
              <input class="form-control" name="Balance" value="0.0">
            </div>
            <div class="mb-2">
              <label class="form-label"># Products</label>
              <input class="form-control" name="NumOfProducts" value="1">
            </div>
            <div class="mb-2">
              <label class="form-label">Has Credit Card (0/1)</label>
              <input class="form-control" name="HasCrCard" value="1">
            </div>
            <div class="mb-2">
              <label class="form-label">Is Active Member (0/1)</label>
              <input class="form-control" name="IsActiveMember" value="1">
            </div>
            <div class="mb-2">
              <label class="form-label">Estimated Salary</label>
              <input class="form-control" name="EstimatedSalary" value="50000">
            </div>

            <button class="btn btn-primary mt-2" type="submit">Predict</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
