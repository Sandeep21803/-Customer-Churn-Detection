<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Churn - Demo UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
      .small-input { max-width: 140px; }
      .tab-pane { padding-top: 1rem; }
      .accent-preview{ width:18px; height:18px; border-radius:4px; display:inline-block; margin-left:8px; vertical-align:middle }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Churn Studio</a>
        <div class="d-flex align-items-center ms-auto">
          <label class="form-check form-switch mb-0 me-3" title="Toggle theme">
            <input class="form-check-input" type="checkbox" id="themeToggle">
            <span class="form-check-label">Dark</span>
          </label>
          <select id="accentSelect" class="form-select form-select-sm" style="width:130px">
            <option value="#0d6efd" selected>Blue</option>
            <option value="#6f42c1">Purple</option>
            <option value="#198754">Green</option>
            <option value="#fd7e14">Orange</option>
          </select>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <h1 class="mb-3">Customer Churn Demo</h1>

      <ul class="nav nav-tabs" id="mainTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="overview-tab" data-bs-toggle="tab" data-bs-target="#overview" type="button" role="tab">Overview</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="predict-tab" data-bs-toggle="tab" data-bs-target="#predict" type="button" role="tab">Predict</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="batch-tab" data-bs-toggle="tab" data-bs-target="#batch" type="button" role="tab">Batch</button>
        </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane active" id="overview" role="tabpanel">
          <div class="row mt-3">
            <div class="col-md-6">
              <h5>Model metrics</h5>
              <ul>
                <li><strong>Accuracy:</strong> {{ metrics['accuracy'] }}</li>
                <li><strong>Recall:</strong> {{ metrics['recall'] }}</li>
                <li><strong>F1:</strong> {{ metrics['f1'] }}</li>
                <li><strong>ROC AUC:</strong> {{ metrics['roc_auc'] }}</li>
              </ul>
            </div>
            <div class="col-md-6">
              <h5>Sample data</h5>
              <div>{{ sample_table | safe }}</div>
            </div>
          </div>
        </div>

        <div class="tab-pane" id="predict" role="tabpanel">
          <div class="row mt-3">
            <div class="col-md-8">
              <form method="post" action="/predict" id="predictForm">
                <div class="row g-2">
                  <div class="col-6 col-md-4">
                    <label class="form-label">Credit Score</label>
                    <input class="form-control" name="CreditScore" type="number" min="300" max="850" value="650">
                  </div>
                  <div class="col-6 col-md-4">
                    <label class="form-label">Geography</label>
                    <select class="form-select" name="Geography">
                      <option>France</option>
                      <option>Spain</option>
                      <option>Germany</option>
                    </select>
                  </div>
                  <div class="col-6 col-md-4">
                    <label class="form-label">Gender</label>
                    <select class="form-select" name="Gender">
                      <option>Male</option>
                      <option>Female</option>
                    </select>
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label">Age</label>
                    <input class="form-control" name="Age" type="number" min="18" max="100" value="40">
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label">Tenure</label>
                    <input class="form-control" name="Tenure" type="number" min="0" max="10" value="3">
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label"># Products</label>
                    <input class="form-control" name="NumOfProducts" type="number" min="1" max="4" value="1">
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label">Has Credit Card</label>
                    <select class="form-select" name="HasCrCard">
                      <option value="1">Yes</option>
                      <option value="0">No</option>
                    </select>
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label">Is Active Member</label>
                    <select class="form-select" name="IsActiveMember">
                      <option value="1">Yes</option>
                      <option value="0">No</option>
                    </select>
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label">Balance</label>
                    <input class="form-control" name="Balance" type="number" step="0.01" value="0.00">
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label">Estimated Salary</label>
                    <input class="form-control" name="EstimatedSalary" type="number" step="1" value="50000">
                  </div>
                </div>
                <div class="mt-3">
                  <button class="btn btn-primary" type="submit">Predict</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="tab-pane" id="batch" role="tabpanel">
          <div class="row mt-3">
            <div class="col-md-8">
              <form method="post" action="/predict_batch" enctype="multipart/form-data">
                <div class="mb-2">
                  <label class="form-label">Upload CSV (columns: CreditScore,Geography,Gender,Age,Tenure,Balance,NumOfProducts,HasCrCard,IsActiveMember,EstimatedSalary)</label>
                  <input class="form-control" name="file" type="file" accept=".csv">
                </div>
                <button class="btn btn-secondary" type="submit">Run Batch Predictions & Download</button>
              </form>
            </div>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Theme toggle + accent color persistence
      const themeToggle = document.getElementById('themeToggle');
      const accentSelect = document.getElementById('accentSelect');
      const applyTheme = (theme, accent)=>{
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.setProperty('--accent', accent);
        themeToggle.checked = (theme==='dark');
      };
      // load
      const savedTheme = localStorage.getItem('churn_theme') || 'light';
      const savedAccent = localStorage.getItem('churn_accent') || '#0d6efd';
      applyTheme(savedTheme, savedAccent);
      // reflect accent select
      accentSelect.value = savedAccent;
      accentSelect.addEventListener('change', ()=>{
        localStorage.setItem('churn_accent', accentSelect.value);
        document.documentElement.style.setProperty('--accent', accentSelect.value);
      });
      themeToggle.addEventListener('change', ()=>{
        const t = themeToggle.checked ? 'dark' : 'light';
        localStorage.setItem('churn_theme', t);
        applyTheme(t, accentSelect.value);
      });
    </script>
  </body>
</html>
