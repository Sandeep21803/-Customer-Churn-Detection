<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="container py-4">
      <a class="btn btn-link mb-3" href="/">← Back</a>
      <div class="row g-3">
        <div class="col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Prediction</h5>
              <p class="lead mb-1">{{ 'Churn' if prediction==1 else 'No churn' }}</p>
              {% if probability is not none %}
              <p class="text-muted">Probability: <strong>{{ '%.3f'|format(probability) }}</strong></p>
              {% endif %}
              <div class="mt-3">
                <a href="/" class="btn btn-outline-secondary">New prediction</a>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Feature importances</h5>
              {% if importances %}
              <canvas id="impChart"></canvas>
              <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
              <script>
                const data = {
                  labels: {{ importances|map(attribute='feature')|list }},
                  datasets: [{
                    label: 'Importance',
                    data: {{ importances|map(attribute='importance')|list }},
                    backgroundColor: 'rgba(54, 162, 235, 0.6)'
                  }]
                };
                new Chart(document.getElementById('impChart'), {
                  type: 'bar',
                  data: data,
                  options: { indexAxis: 'y', responsive: true }
                });
              </script>
              {% else %}
              <p class="text-muted">No feature importance available for this model.</p>
              {% endif %}
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      // apply saved theme/accent from localStorage for consistency
      const savedTheme = localStorage.getItem('churn_theme') || 'light';
      const savedAccent = localStorage.getItem('churn_accent') || '#0d6efd';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.documentElement.style.setProperty('--accent', savedAccent);
    </script>
  </body>
</html>
