<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1>Prediction Result</h1>
      <div class="card mt-3">
        <div class="card-body">
          <h5 class="card-title">Churn Prediction</h5>
          <p class="card-text">Predicted class: <strong>{{ 'Churn' if prediction==1 else 'No churn' }}</strong></p>
          {% if probability is not none %}
          <p class="card-text">Probability of churn: <strong>{{ '%.3f'|format(probability) }}</strong></p>
          {% endif %}
          <a href="/" class="btn btn-secondary mt-2">Back</a>
        </div>
      </div>
    </div>
  </body>
</html>
